<!DOCTYPE html>
<html lang="nl-BE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Thomas Zhu</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body class="p-3 main-bg">

<header class="top-bar">
  <!-- Navigatie -->
  <nav class="navbar navbar-expand-md navbar-dark bg-transparent w-100">
    <a class="navbar-brand p-0" href="index.html">
      <img src="assets/images/logo.png" alt="Logo" class="site-logo">
    </a>
    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto me-3">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="portfolio.html">Portfolio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="contact.html">Contact</a>
        </li>
      </ul>
    </div>
  </nav>
</header>


<main class="container">
  <h1>Contact</h1>

  <form name="contact" method="POST" data-netlify="true" action="/contact">

    <input type="hidden" name="form-name" value="contact">

    <div class="row mb-3">
      <div class="col-12 col-md-4">
        <label class="form-label">Naam</label>
        <input type="text" name="name" class="form-control" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12 col-md-4">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12 col-md-8">
        <label class="form-label">Bericht</label>
        <textarea name="message" class="form-control" rows="4" required></textarea>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Verzenden</button>

  </form>
</main>

<footer class="bg-transparent text-center p-3 mt-4">
  © 2026 Thomas Zhu
</footer>
</body>
</html>
